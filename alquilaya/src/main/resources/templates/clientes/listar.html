<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Clientes - Alquilaya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Alquilaya</a>
            <a class="btn btn-outline-light btn-sm" href="/">Volver al Inicio</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Listado de Clientes Registrados</h2>
            <!-- Aquí puedes agregar un botón para registrar nuevo cliente si tu controlador lo soporta -->
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Bucle de Thymeleaf que recorre la lista enviada desde el controlador -->
                        <tr th:each="cliente : ${clientes}">
                            <td th:text="${cliente.id}">1</td>
                            <td th:text="${cliente.nombre}">Juan Pérez</td>
                            <td th:text="${cliente.email}">juan@mail.com</td>
                            <td th:text="${cliente.telefono}">555123456</td>
                        </tr>
                        <!-- Mensaje si no hay registros -->
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td colspan="4" class="text-center text-muted py-4">No hay clientes registrados en la base de datos.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
