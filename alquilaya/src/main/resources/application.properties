spring.application.name=alquilaya

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/alquilaya?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root1234

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Thymeleaf (Opcional, recomendado para desarrollo)
spring.thymeleaf.cache=false

# Puerto del servidor
server.port=8081
# Configuración del administrador
app.admin.email=admin@alquilaya.com
app.admin.password=CambiaEstaClave123!